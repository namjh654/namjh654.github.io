name: Build & Deploy

# 브랜치 흐름: 작업 브랜치(namjh654/*) → dev → master
#
# 배포 대상은 저장소 변수 DEPLOY_TARGET 으로 고른다 (Settings → Secrets and variables → Actions → Variables)
#   github-pages (기본) : master push → https://namjh654.github.io/   (dev·PR 은 빌드 검사만)
#   cloudflare          : master push → 운영, dev push → 미리보기(dev.<프로젝트>.pages.dev)
#                         필요: secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID / vars CF_PAGES_PROJECT, SITE_URL
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # 운영(master) 배포는 중간에 취소하지 않고 순서대로 처리한다. 나머지 브랜치는 이전 실행을 취소한다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      REACT_APP_DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'github-pages' }}
      REACT_APP_SITE_URL: ${{ vars.SITE_URL || 'https://namjh654.github.io' }}
      REACT_APP_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }} # contact-api 배포 주소 + /api/contact
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test contact API
        run: npm test --prefix contact-api
      - name: Install headless browser (prerender)
        run: npx playwright install --with-deps chromium --only-shell
      - name: Build + prerender
        run: npm run build:site # CI=true 이므로 ESLint 경고도 실패로 처리된다

      - name: Upload (GitHub Pages)
        if: env.REACT_APP_DEPLOY_TARGET == 'github-pages' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
          include-hidden-files: true # .nojekyll 포함 (v4 부터 기본 제외)
      - name: Upload (Cloudflare)
        if: env.REACT_APP_DEPLOY_TARGET == 'cloudflare' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build
          include-hidden-files: true
          retention-days: 3

  deploy-github-pages:
    if: (vars.DEPLOY_TARGET || 'github-pages') == 'github-pages' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    if: vars.DEPLOY_TARGET == 'cloudflare' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'preview' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'bongbong-studio' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: build
      - name: Create Pages project (first run only)
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=master || true
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy build --project-name="$PROJECT" --branch="${{ github.ref_name }}"
