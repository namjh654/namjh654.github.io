<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a3ff5e" />
    <meta
      name="description"
      content="봉봉 스튜디오 — 건축 설계, 리모델링, 인테리어, 공간 브랜딩 포트폴리오"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BONGBONG STUDIO" />
    <meta property="og:title" content="BONGBONG STUDIO" />
    <meta
      property="og:description"
      content="공간에 오래 남는 이야기를 설계합니다. 프로젝트 결과물과 작업 비하인드."
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // 저장된 테마를 첫 렌더 전에 적용해 깜빡임을 막는다.
      try {
        var saved = JSON.parse(localStorage.getItem("bongbong-theme") || "null");
        var theme =
          (saved && saved.state && saved.state.theme) ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <title>BONGBONG STUDIO</title>
  </head>
  <body>
    <noscript>이 사이트는 JavaScript 가 필요합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
